# ---------------------------------------------------------------------------
# --- Synthetic Manuscript Layout Generator Config (v2.1) ---
# ---------------------------------------------------------------------------

# --- Run Configuration ---
seed: 42
generation_mode: 'standard' # 'standard', 'grid', or 'concentric'
max_placement_attempts: 50  # Max attempts to place an ancillary box before giving up

# --- Feature Flags ---
features:
  allow_interlinear_gloss: true

augmentations:
  use_textbox_warp: true
  use_missing_chars: true

# --- Page Parameters ---
page:
  aspect_ratio: { type: 'Uniform', min: 0.7, max: 1.4 }
  base_height: 1000.0 # Unnormalized height, width is calculated from this

# --- Textbox Parameters (General) ---
textbox:
  ancillary_box_count: { type: 'Poisson', lambda: 2 }
  type_probabilities:
    main_text: 1.0 # The first box is always main_text
    marginalia: 0.6
    interlinear_gloss: 0.2 # This is the probability a gloss is ATTEMPTED per line gap
    header: 0.1
    footer: 0.1

# --- Content Generation Parameters ---
content:
  lines_per_box: { type: 'Poisson', lambda: 12 }
  words_per_line: { type: 'Poisson', lambda: 8 }
  chars_per_word: { type: 'Poisson', lambda: 7 }

# --- Spacing & Jitter Parameters (relative to font_size) ---
spacing:
  base_font_size: { type: 'LogNormal', mu: 3.0, sigma: 0.2 } # In absolute units
  char_spacing_multiplier: { type: 'Normal', mu: 0.8, sigma: 0.1 }
  word_spacing_multiplier: 1.5 # Multiplier for char_spacing to create a space
  line_spacing_multiplier: { type: 'Normal', mu: 1.5, sigma: 0.2 }
  line_break_fraction: { type: 'Uniform', min: 0.8, max: 1.0 }
  positional_jitter: { type: 'Normal', mu: 0.0, sigma: 0.05 }

# --- Box-Specific Parameter Overrides ---
box_specific:
  main_text:
    orientation_deg: { type: 'Normal', mu: 0, sigma: 2.5 }
  marginalia:
    orientation_deg: { type: 'Uniform', min: -45, max: 45 }
    lines_per_box: { type: 'Poisson', lambda: 5 }
    base_font_size: { type: 'LogNormal', mu: 2.5, sigma: 0.2 }
  interlinear_gloss:
    orientation_deg: { type: 'Normal', mu: 0, sigma: 1.0 } # Relative to main text line
    lines_per_box: { type: 'Constant', value: 1 }
    words_per_line: { type: 'Poisson', lambda: 3 }
    base_font_size: { type: 'LogNormal', mu: 2.0, sigma: 0.1 }

# --- Augmentation Parameters ---
textbox_warp:
  amplitude_multiplier: { type: 'Uniform', min: 0.01, max: 0.05 } # Multiplier of textbox width/height
  frequency_multiplier: { type: 'Poisson', lambda: 0.5 }  # How many waves across the box

missing_chars:
  probability: 0.03

# --- Special Layout Parameters ---
grid_layout:
  rows: { type: 'Poisson', lambda: 20 }
  cols: { type: 'Poisson', lambda: 15 }
  spacing: { type: 'Uniform', min: 20, max: 40 }
  font_size: { type: 'Uniform', min: 15, max: 25 }

concentric_layout:
  num_circles: { type: 'Poisson', lambda: 10 }
  start_radius: { type: 'Uniform', min: 50, max: 150 }
  radial_spacing: { type: 'Uniform', min: 25, max: 40 }
  font_size: { type: 'Uniform', min: 15, max: 25 }